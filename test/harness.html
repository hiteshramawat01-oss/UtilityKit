<!DOCTYPE html>
<!--
  Runs the real ui.html and the real code.js on top of a mock Figma — including
  start-up, so the loader, "Update now" and restarts behave as they do in Figma.
  Serve the project folder over http and open /test/harness.html
  (test/e2e.py does this for you).
-->
<html><head><meta charset="utf-8"><title>UtilityKit harness</title>
<style>html,body{margin:0;height:100%;background:#888}iframe{border:0;width:100%;height:100%;display:block}</style>
</head><body>
<iframe id="ui"></iframe>
<script src="mock-figma.js"></script>
<script>
  var env = createMockFigma();
  var figma = env.figma;
  var frame = document.getElementById('ui');

  // The plugin window: showUI loads whatever HTML the plugin hands over, as Figma does.
  figma._showUI = function (html) { frame.srcdoc = html; };
  figma.ui.postMessage = function (m) { frame.contentWindow.postMessage({ pluginMessage: JSON.parse(JSON.stringify(m)) }, '*'); };
  figma.ui.resize = function (w, h) { env.log.uiSize = { width: w, height: h }; };
  window.addEventListener('message', function (e) {
    var msg = e.data && e.data.pluginMessage;
    if (!msg || e.source !== frame.contentWindow) return;
    if (figma.ui.onmessage) figma.ui.onmessage(msg);
  });

  // GitHub, answered locally. version.json comes from __versionJson (null = not found,
  // 'offline' = network error); code.js and ui.html come from __remoteFiles.
  window.__versionJson = null;
  window.__remoteFiles = {};
  var realFetch = window.fetch;
  window.fetch = function (url) {
    var u = String(url);
    var at = u.indexOf('raw.githubusercontent.com');
    if (at === -1) return realFetch.apply(this, arguments);
    (env.log.fetched = env.log.fetched || []).push(u);
    var name = u.replace(/\?.*$/, '').split('/main/')[1];
    var body = name === 'version.json' ? window.__versionJson : window.__remoteFiles[name];
    if (body === 'offline') return Promise.reject(new TypeError('Failed to fetch'));
    return Promise.resolve(body === null || body === undefined
      ? { ok: false, status: 404, text: function () { return Promise.resolve('404: Not Found'); } }
      : { ok: true, status: 200, text: function () { return Promise.resolve(body); } });
  };

  // A small demo document so the harness is useful by hand too.
  var art = env.add('FRAME', { name: 'Desktop', x: 0, y: 0, width: 1440, height: 3200 });
  window.demo = {
    art: art,
    a: env.add('FRAME', { name: '2026-05 - home page', x: 0, y: 0, width: 1440, height: 900 }, art),
    b: env.add('FRAME', { name: 'pricing_page', x: 0, y: 900, width: 1440, height: 700 }, art),
    c: env.add('FRAME', { name: 'About - Design - Acme Corp - V1', x: 0, y: 1600, width: 1440, height: 800 }, art),
    // top-level frames at the team's standard widths
    d1: env.add('FRAME', { name: 'Frame 1', x: 2000, y: 0, width: 1600, height: 3000 }),
    d2: env.add('FRAME', { name: 'Frame 2', x: 4000, y: 0, width: 1600, height: 3400 }),
    m1: env.add('FRAME', { name: 'Frame 3', x: 6000, y: 0, width: 320, height: 2600 })
  };
  figma.currentPage.name = '2026-05 - Homepage';

  /** Runs the plugin the way Figma does when it is opened: fresh listeners, code.js from the folder. */
  window.launch = function () {
    env.listeners.selectionchange = [];
    env.listeners.currentpagechange = [];
    figma.ui.onmessage = null;
    env.log.launches = (env.log.launches || 0) + 1;
    var s = document.createElement('script');
    s.src = '../code.js?launch=' + env.log.launches;
    document.body.appendChild(s);
  };

  var __html__ = '';
  realFetch('../ui.html').then(function (r) { return r.text(); }).then(function (text) {
    __html__ = text;
    window.launch();
  });
</script>
</body></html>
